# Nome e identificador do app. Para trocar o nome público do projeto, mude só estas duas linhas.
appName=pc-panel
appId=org.pcpanel.app

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official

# O :core compila o Kotlin de produção para Java 8 (trava de API do Android 8.1) e não tem código Java: a checagem de alvo é só aviso.
kotlin.jvm.target.validation.mode=warning
