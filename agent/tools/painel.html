<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do PC</title>
<style>
:root{
  color-scheme: dark light;
  --bg:#0d1117; --panel:#161b22; --panel2:#1d242d; --line:#2a323d; --text:#e6edf3; --muted:#8b98a5;
  --accent:#4c9aff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f5f8; --panel:#fff; --panel2:#eef2f6; --line:#dbe2ea; --text:#17202a; --muted:#5d6b79;
         --accent:#0b66e4; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.conn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 420px}
.conn input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
#url{flex:1 1 220px} #token{flex:1 1 160px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--ok)} .pill.wait .dot{background:var(--warn)} .pill.off .dot{background:var(--bad)}
.meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
@media (max-width:1100px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0;transition:opacity .3s}
.card.wide{grid-column:span 2} @media (max-width:760px){.card.wide{grid-column:auto}}
.card.stale{opacity:.55} .card.disabled{opacity:.4}
.card h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card h2 .age{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0;font-size:11px}
.chip{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-transform:none;letter-spacing:0}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.empty{color:var(--muted);padding:6px 0}
.row{display:flex;gap:14px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.big{font-size:30px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}
.sub{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)} .bar>i.ok{background:var(--ok)}
.barrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;gap:8px}
.barrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
svg.spark{width:100%;height:34px;display:block}
svg.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)} .ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--panel2)} .ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .4s,stroke .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
.cover{width:92px;height:92px;border-radius:10px;background:var(--panel2);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--muted);font-size:30px}
.title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.list li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.member{display:flex;align-items:center;gap:8px}
.member i{width:9px;height:9px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);flex:none}
.member.speaking i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--panel2);object-fit:cover;flex:none}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
side{display:flex;flex-direction:column;gap:14px;align-content:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.events{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ev{border-left:3px solid var(--muted);padding:3px 0 3px 9px;font-size:13px}
.ev.info{border-color:var(--ok)} .ev.warn{border-color:var(--warn)} .ev.critical{border-color:var(--bad)}
.ev time{display:block;color:var(--muted);font-size:11px}
.form{display:grid;gap:8px}
.form select,.form textarea,.form input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.log{height:240px;overflow:auto;background:var(--panel2);border-radius:8px;padding:8px;font:11.5px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.log .up{color:var(--accent)} .log .err{color:var(--bad)} .log .res{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:8px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
.mixrow{display:grid;grid-template-columns:minmax(70px,1fr) minmax(80px,1.4fr) 3.2ch auto;gap:8px;align-items:center;padding:4px 0}
.mixrow .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px} .mixrow.idle .mn{color:var(--muted)}
.mixrow .mv{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.mixrow .btn{padding:3px 8px;min-width:0}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl .btn{padding:6px 12px;min-width:42px;line-height:1.2}
.btn.primary-round{background:var(--accent);border-color:var(--accent);color:#fff;border-radius:99px;padding:6px 18px;font-size:16px}
.btn.tgl.off{background:color-mix(in srgb,var(--bad) 18%,var(--panel2));border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px;border-radius:6px;line-height:1}
.icon:hover{color:var(--accent)} .icon[hidden]{display:none}
.seek{padding:6px 0;margin:-6px 0;border-radius:6px}
.seek.can{cursor:pointer} .seek.can:hover .bar>i{background:var(--ok)}
.seek:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <h1>Painel do PC</h1>
  <form class="conn" id="connForm" autocomplete="off">
    <label class="sr" for="url">URL do agente</label>
    <input id="url" value="ws://127.0.0.1:8765/ws" spellcheck="false">
    <label class="sr" for="token">Token</label>
    <input id="token" type="password" placeholder="token do agente" spellcheck="false">
    <button class="btn primary" id="btnConn" type="submit">Conectar</button>
  </form>
  <span class="pill off" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Desconectado</span></span>
  <span class="meta"><span id="host"></span><span id="stats"></span></span>
</header>

<div class="layout">
  <main class="grid" id="grid"></main>
  <aside style="display:flex;flex-direction:column;gap:14px;align-content:start">
    <section class="panel"><h2>Eventos</h2><div class="events" id="events"><div class="empty">Nenhum evento ainda.</div></div></section>
    <section class="panel">
      <h2>Enviar ação</h2>
      <form class="form" id="actForm">
        <label class="sr" for="aPlugin">Plugin</label><select id="aPlugin"></select>
        <label class="sr" for="aAction">Ação</label><select id="aAction"></select>
        <label class="sr" for="aArgs">Argumentos (JSON)</label><textarea id="aArgs" rows="2" spellcheck="false">{}</textarea>
        <button class="btn" type="submit">Enviar</button>
      </form>
    </section>
    <section class="panel">
      <details>
        <summary>Mensagens brutas</summary>
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <button class="btn" id="btnPause" type="button">Pausar</button>
          <button class="btn" id="btnClear" type="button">Limpar</button>
          <label class="sub" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="onlyImportant"> só eventos e erros</label>
        </div>
        <div class="log" id="log" role="log"></div>
      </details>
    </section>
  </aside>
</div>
<div id="toastHost"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("pt-BR", {maximumFractionDigits: d, minimumFractionDigits: d});
const gb = mb => mb == null ? "–" : num(mb / 1024, 1) + " GB";
const mbps = kbps => kbps == null ? "–" : kbps >= 1000 ? num(kbps / 1000, 1) + " Mb/s" : num(kbps) + " kb/s";
const tok = n => n == null ? "–" : n >= 1e6 ? num(n / 1e6, 1) + " M" : n >= 1e3 ? num(n / 1e3, 1) + " k" : num(n);
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const tone = (p, warn = 70, bad = 90) => p == null ? "" : p >= bad ? "bad" : p >= warn ? "warn" : "ok";
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? s + " s" : s < 3600 ? Math.floor(s / 60) + " min" : s < 86400 ? Math.floor(s / 3600) + " h" : Math.floor(s / 86400) + " d";
}
function until(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000;
  if (!isFinite(s)) return "";
  if (s <= 0) return "agora";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return "em " + (h >= 24 ? Math.floor(h / 24) + " d " + (h % 24) + " h" : h ? h + " h " + String(m).padStart(2, "0") + " min" : m + " min");
}
const bar = (p, cls) => `<div class="bar"><i class="${cls ?? tone(p)}" style="width:${Math.min(100, Math.max(0, p || 0))}%"></i></div>`;
const barRow = (label, right, p, cls) => `<div><div class="barrow"><span>${esc(label)}</span><span>${right}</span></div>${bar(p, cls)}</div>`;
function ring(p, text) {
  const r = 38, c = 2 * Math.PI * r, v = Math.min(100, Math.max(0, p || 0));
  const color = {ok: "var(--ok)", warn: "var(--warn)", bad: "var(--bad)"}[tone(p, 60, 85)] || "var(--muted)";
  return `<div class="ring"><svg viewBox="0 0 90 90" width="86" height="86"><circle class="bg" cx="45" cy="45" r="${r}"/>` +
    `<circle class="fg" cx="45" cy="45" r="${r}" style="stroke:${color}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v / 100)}"/></svg><b>${text ?? num(p)}</b></div>`;
}
function spark(arr, max) {
  if (arr.length < 2) return `<svg class="spark" viewBox="0 0 120 32"></svg>`;
  const m = max ?? Math.max(1, ...arr), step = 120 / (HIST - 1), off = (HIST - arr.length) * step;
  const pts = arr.map((v, i) => `${(off + i * step).toFixed(1)},${(30 - Math.min(1, v / m) * 28).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none"><polyline points="${pts}"/></svg>`;
}
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || ""); el.textContent = msg;
  $("toastHost").appendChild(el); setTimeout(() => el.remove(), 5000);
}

/* ---------- estado ---------- */
const HIST = 60;
const S = {};                 // fonte -> {data, ts, at}
const INFO = {};              // fonte -> {id,name,status,intervalMs,actions}
const H = {cpu: [], rx: [], tx: [], gpu: []};
const dirty = new Set();
let ws = null, wantOpen = false, retry = 0, retryTimer = null, total = 0, lastTotal = 0, pingMs = null, paused = false, seq = 0;
let pingTimer = null, httpBase = "", tokenValue = "";

/* ---------- ações: só aparecem quando o agente as declara no hello ---------- */
const can = (p, a) => INFO[p]?.status !== "disabled" && (INFO[p]?.actions || []).some(x => (typeof x === "string" ? x : x.name) === a);
function btn(label, plugin, action, args = {}, title = "", cls = "", confirmMsg = "") {
  if (!can(plugin, action)) return "";
  return `<button class="btn ${cls}" type="button" data-p="${plugin}" data-a="${action}" data-args="${esc(JSON.stringify(args))}"` +
    `${title ? ` title="${esc(title)}" aria-label="${esc(title)}"` : ""}${confirmMsg ? ` data-confirm="${esc(confirmMsg)}"` : ""}>${label}</button>`;
}
const relBtn = (label, delta, title) => can("media", "seek")
  ? `<button class="btn" type="button" data-rel="${delta}" title="${title}" aria-label="${title}">${label}</button>` : "";
const PENDING = {};
const FRIENDLY = {unknown_session: "esse app não está mais no mixer.", no_session: "nenhuma mídia ativa.", not_supported: "o app não aceita esse controle agora.", not_connected: "Discord não está conectado.",
  discord_recusou: "o Discord recusou o comando.", unknown_plugin: "plugin desligado ou inexistente.", unknown_action: "ação não suportada.",
  invalid_args: "argumento inválido.", timeout: "a ação demorou demais."};
function mediaPos() {
  const s = S.media; if (!s) return 0;
  const d = s.data; let p = d.positionSec || 0;
  if (d.status === "playing") p += (Date.now() - s.at) / 1000;
  return Math.min(p, d.durationSec || 0);
}
/** Mostra o efeito na hora; o update do agente confirma, e uma falha desfaz (ver action_result). */
function optimistic(plugin, action, args) {
  const s = S[plugin]; if (!s) return;
  const d = s.data; let patch = null;
  if (plugin === "media") {
    if (action === "play_pause" || action === "play" || action === "pause") {
      const playing = action === "play" ? true : action === "pause" ? false : d.status !== "playing";
      patch = {status: playing ? "playing" : "paused", positionSec: Math.round(mediaPos())};
    } else if (action === "seek") patch = {positionSec: args.positionSec};
  } else if (plugin === "discord") {
    if (action === "toggle_mute") patch = {mute: !d.mute};
    else if (action === "toggle_deaf") patch = {deaf: !d.deaf};
    else if (action === "set_input_volume") patch = {inputVolume: args.value};
    else if (action === "set_output_volume") patch = {outputVolume: args.value};
  } else if (plugin === "audio") {
    if (action === "toggle_mute") patch = {muted: !d.muted};
    else if (action === "set_volume") patch = {volume: args.value};
    else if (action === "set_session_volume") patch = {sessions: (d.sessions || []).map(a => a.id === args.id ? {...a, volume: args.value} : a)};
    else if (action === "toggle_session_mute") patch = {sessions: (d.sessions || []).map(a => a.id === args.id ? {...a, muted: !a.muted} : a)};
  } else if (plugin === "notifications" && action === "clear_all") patch = {count: 0, apps: []};
  if (!patch) return;
  s.prev = d; s.data = {...d, ...patch}; s.at = Date.now();
  dirty.add(plugin); schedule();
}
document.addEventListener("click", e => {
  const bar = e.target.closest("#mBar");
  if (bar && can("media", "seek")) {
    const r = bar.getBoundingClientRect(), dur = S.media?.data.durationSec || 0;
    if (dur) sendAction("media", "seek", {positionSec: Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur)});
    return;
  }
  const b = e.target.closest("[data-a], [data-rel]"); if (!b) return;
  if (b.dataset.rel) {
    const dur = S.media?.data.durationSec || 0;
    return sendAction("media", "seek", {positionSec: Math.round(Math.min(dur, Math.max(0, mediaPos() + Number(b.dataset.rel))))});
  }
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  sendAction(b.dataset.p, b.dataset.a, b.dataset.args ? JSON.parse(b.dataset.args) : {});
});
document.addEventListener("keydown", e => {   // barra de posição: setas ±5 s
  if (e.target.id !== "mBar" || !can("media", "seek") || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  const dur = S.media?.data.durationSec || 0;
  sendAction("media", "seek", {positionSec: Math.round(Math.min(dur, Math.max(0, mediaPos() + (e.key === "ArrowLeft" ? -5 : 5))))});
});

/* ---------- cartões ---------- */
const CARDS = [
  {id: "system", title: "Sistema", render: rSystem},
  {id: "gpu", title: "GPU", render: rGpu},
  {id: "media", title: "Mídia", render: rMedia},
  {id: "audio", title: "Áudio", render: rAudio},
  {id: "activeWindow", title: "Janela ativa", render: rWindow},
  {id: "ups", title: "Nobreak", render: rUps},
  {id: "weather", title: "Clima", render: rWeather},
  {id: "notifications", title: "Notificações", render: rNotif},
  {id: "claude", title: "Claude", render: rClaude, wide: true},
  {id: "steam", title: "Steam", render: rSteam},
  {id: "discord", title: "Discord", render: rDiscord},
];
function ensureCard(def) {
  let el = $("card-" + def.id);
  if (el) return el;
  el = document.createElement("section");
  el.className = "card" + (def.wide ? " wide" : ""); el.id = "card-" + def.id;
  el.innerHTML = `<h2><span>${esc(def.title)}</span><span class="chip" data-st></span><span class="age" data-age></span>` +
    `<button class="icon" type="button" data-refresh data-p="${esc(def.id)}" data-a="refresh" title="Atualizar agora" aria-label="Atualizar ${esc(def.title)} agora" hidden>↻</button></h2>` +
    `<div data-body><div class="empty">Aguardando dados…</div></div>`;
  $("grid").appendChild(el);
  return el;
}
CARDS.forEach(ensureCard);

function rSystem(d) {
  const cpu = d.cpu?.percent, ram = d.ram || {}, rp = ram.totalMb ? ram.usedMb / ram.totalMb * 100 : null;
  return `<div class="row">${ring(cpu, num(cpu) + "%")}<div class="col"><div class="sub">CPU</div>${spark(H.cpu, 100)}</div></div>` +
    `<div style="margin:12px 0">${barRow("Memória", gb(ram.usedMb) + " / " + gb(ram.totalMb), rp)}</div>` +
    (d.disks || []).map(k => barRow("Disco " + k.name, num(k.usedGb, 0) + " / " + num(k.totalGb, 0) + " GB", k.totalGb ? k.usedGb / k.totalGb * 100 : 0, k.totalGb && k.usedGb / k.totalGb > .9 ? "bad" : "")).join("<div style='height:7px'></div>") +
    `<div class="kv" style="margin-top:12px"><span>Rede ↓</span><span>${mbps(d.net?.rxKbps)}</span><span>Rede ↑</span><span>${mbps(d.net?.txKbps)}</span></div>` +

    }
    case "snapshot": case "update": {
      const id = m.source; S[id] = {data: m.data, ts: m.ts, at: Date.now()};
      if (id === "system") {
        push(H.cpu, m.data.cpu?.percent); push(H.rx, m.data.net?.rxKbps); push(H.tx, m.data.net?.txKbps);
      } else if (id === "gpu") push(H.gpu, m.data.utilPercent);
      dirty.add(id); schedule(); break;
    }
    case "event": addEvent(m); break;
    case "pong": pingMs = Date.now() - m.data.t; break;
    case "action_result": {
      const p = PENDING[m.data.id]; delete PENDING[m.data.id];
      if (m.data.ok) break;
      if (p && S[p.plugin]?.prev) { S[p.plugin].data = S[p.plugin].prev; dirty.add(p.plugin); schedule(); }   // desfaz o efeito otimista
      toast(`${p ? p.plugin + "." + p.action : "Ação"}: ${FRIENDLY[m.data.error] || m.data.error}`, "bad");
      break;
    }
    case "error": toast(m.data.code + ": " + m.data.message, "bad"); break;
  }
}
function push(a, v) { if (v == null) return; a.push(v); while (a.length > HIST) a.shift(); }

/* ---------- painel de ações ---------- */
function fillActions() {
  const plugins = Object.values(INFO).filter(p => p.status !== "disabled" && (p.actions || []).length);
  const sel = $("aPlugin"); sel.innerHTML = plugins.map(p => `<option value="${esc(p.id)}">${esc(p.id)}</option>`).join("");
  fillActionNames();
}
function fillActionNames() {
  const p = INFO[$("aPlugin").value];
  $("aAction").innerHTML = (p?.actions || []).map(a => { const n = typeof a === "string" ? a : a.name; return `<option>${esc(n)}</option>`; }).join("");
  $("aArgs").value = $("aAction").value === "set_volume" ? '{"value": 40}' : "{}";
}
$("aPlugin").onchange = fillActionNames; $("aAction").onchange = () => { $("aArgs").value = $("aAction").value === "set_volume" ? '{"value": 40}' : "{}"; };
$("actForm").addEventListener("submit", e => {
  e.preventDefault();
  let args; try { args = JSON.parse($("aArgs").value || "{}"); } catch { toast("Argumentos não são um JSON válido.", "bad"); return; }
  sendAction($("aPlugin").value, $("aAction").value, args);
});

/* ---------- início ---------- */
const q = new URLSearchParams(location.search);
$("url").value = q.get("url") || store.get("painel.url") || $("url").value;
</script>
